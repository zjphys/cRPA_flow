[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vasp-scf-crpa-workflow"
version = "1.4.1"
description = "Command-line preparation, execution and analysis of VASP SCF-to-cRPA workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["numpy>=1.23", "matplotlib>=3.6"]

[project.scripts]
vasp-workflow = "vasp_workflow.cli:main"
vasp-workflow-batch = "vasp_workflow.cli:batch_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vasp_workflow = ["resources/*.sh", "resources/*.conf"]
